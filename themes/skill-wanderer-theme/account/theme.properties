# Skill-Wanderer Account Console theme
#
# The Keycloak 26.x account console is a React/PatternFly 5 single-page app that
# ships as the `keycloak.v3` account theme. It cannot be re-templated with
# FreeMarker like the login theme, so branding is applied by:
#   1. overriding PatternFly design tokens + component styles (css/account.css)
#   2. pinning the dark colour scheme on (js/theme-init.js)
#   3. the logo / favicon / title properties below
parent=keycloak.v3

# Skill-Wanderer is dark-first, so we do NOT let the console follow the OS
# colour scheme. `darkMode=false` removes the upstream prefers-color-scheme
# toggle from index.ftl; js/theme-init.js pins the dark class instead.
darkMode=false
kcDarkModeClass=pf-v5-theme-dark

styles=css/account.css
scripts=js/theme-init.js

# Masthead brand image (resolved against the theme's resource URL)
logo=/img/cropped-skill-wanderer-logo-768x256.webp

# Browser tab
favIcon=/img/favicon.svg
favIconType=image/svg+xml
title=Skill-Wanderer Account
description=Manage your Skill-Wanderer account, sign-in methods and connected applications.
